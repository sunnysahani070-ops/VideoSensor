version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videosensor-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - STORAGE_MODE=r2
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=auto
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL}
      - S3_FORCE_PATH_STYLE=false
    volumes:
      - prod_uploads:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  prod_uploads:
